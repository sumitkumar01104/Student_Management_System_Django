{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">All Students</h2>

<table border="1" style="margin: auto; width: 80%; border-collapse: collapse; text-align: center;">
    <tr>
        <th style="padding: 10px;">Name</th>
        <th style="padding: 10px;">Mobile</th>
        <th style="padding: 10px;">DOB</th>
        <th style="padding: 10px;">Email</th>
    </tr>

    {% for s in students %}
    <tr>
        <td style="padding: 10px;">{{ s.name }}</td>
        <td style="padding: 10px;">{{ s.mobile_no }}</td>
        <td style="padding: 10px;">{{ s.DoB }}</td>
        <td style="padding: 10px;">{{ s.email }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
