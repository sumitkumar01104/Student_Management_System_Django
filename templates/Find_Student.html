{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">Find Student</h2>

<form method="GET" style="text-align: center; margin-bottom: 20px;">
    <input type="text" name="q" placeholder="Enter name to search" required>
    <button type="submit">Search</button>
</form>

{% if students %}
<table border="1" style="margin: auto; width: 80%; border-collapse: collapse; text-align: center;">
    <tr>
        <th style="padding: 10px;">Name</th>
        <th style="padding: 10px;">Mobile</th>
        <th style="padding: 10px;">DOB</th>
        <th style="padding: 10px;">Email</th>
    </tr>

    {% for s in students %}
    <tr>
        <td style="padding: 10px;">{{ s.name }}</td>
        <td style="padding: 10px;">{{ s.mobile_no }}</td>
        <td style="padding: 10px;">{{ s.DoB }}</td>
        <td style="padding: 10px;">{{ s.email }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p style="text-align: center;">No result found</p>
{% endif %}

{% endblock %}
