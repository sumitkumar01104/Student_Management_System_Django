{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">Delete Student</h2>

<form method="POST" style="text-align: center; margin-bottom: 20px;">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Enter name to delete" required>
    <button type="submit">Search</button>
</form>

{% if students %}
<table border="1" style="margin: auto; width: 80%; border-collapse: collapse; text-align: center;">
    <tr>
        <th style="padding: 10px;">Name</th>
        <th style="padding: 10px;">Mobile</th>
        <th style="padding: 10px;">DOB</th>
        <th style="padding: 10px;">Email</th>
        <th style="padding: 10px;">Action</th>
    </tr>

    {% for s in students %}
    <tr>
        <td style="padding: 10px;">{{ s.name }}</td>
        <td style="padding: 10px;">{{ s.mobile_no }}</td>
        <td style="padding: 10px;">{{ s.DoB }}</td>
        <td style="padding: 10px;">{{ s.email }}</td>
        <td style="padding: 10px;">
            <a href="{% url 'delete_student' s.id %}" onclick="return confirm('Are you sure to delete?')">
                Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endif %}

{% endblock %}
